name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Tests use the model-free "fake" embedder, so PyTorch/CLIP are not needed here.
      - run: pip install fastapi "uvicorn[standard]" python-multipart pillow pillow-heif numpy pytest httpx
      - run: pytest -q
        env:
          PHOTOSIFT_EMBEDDER: fake
