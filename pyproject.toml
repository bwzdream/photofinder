[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photosift"
version = "0.1.0"
description = "Index, organize and search your photos with a local AI model"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "pillow>=10.0",
  "pillow-heif>=0.16",
  "numpy>=1.26",
  "torch>=2.1",
  "open_clip_torch>=2.24",
]

[project.optional-dependencies]
gdrive = ["google-api-python-client>=2.100", "google-auth-oauthlib>=1.2"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
photosift = "photosift.cli:main"

[tool.setuptools]
packages = ["photosift", "photosift.sources"]

[tool.setuptools.package-data]
photosift = ["static/*"]
